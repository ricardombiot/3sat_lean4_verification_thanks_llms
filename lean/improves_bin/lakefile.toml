name = "abs-sat-bin"
version = "0.1.0"
defaultTargets = ["AbsSatBin"]

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "AbsSatBin"
root = "AbsSatBin"

# Dump of the arithmetic bin map, for the differential against Julia (scripts/diff_map_bin.sh).
[[lean_exe]]
name = "mapbin-dump"
root = "MapBinDumpMain"

# The pure bin machine against brute force, with the dead-node check.
[[lean_exe]]
name = "driverbin-check"
root = "DriverBinCheckMain"

# Probe: OtherBit / PinChain on every ReadFirst branch of the reader (read-only).
[[lean_exe]]
name = "otherbit-probe"
root = "OtherBitProbeMain"

# Probe: AmbHigh / TriPin on every ReadFirst branch of the reader (read-only).
[[lean_exe]]
name = "ambhigh-probe"
root = "AmbHighProbeMain"

# Cross-check of the first TriPin failure found by ambhigh-probe (read-only).
[[lean_exe]]
name = "ambhigh-dump"
root = "AmbHighDumpMain"
