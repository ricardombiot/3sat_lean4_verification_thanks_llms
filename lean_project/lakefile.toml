name = "abs-sat"
version = "0.1.0"

[leanOptions]
warningAsError = true

[dependencies]
std = { git = "https://github.com/leanprover/std4" }

[[lean_lib]]
name = "AbsSat"
root = "AbsSat"

[[lean_exe]]
name = "runTests"
root = "Main"

[[lean_exe]]
name = "diffTest"
root = "DiffMain"

[[lean_exe]]
name = "l6search"
root = "L6SearchMain"

[[lean_exe]]
name = "width"
root = "WidthMain"

[[lean_exe]]
name = "validate"
root = "ValidateMain"

[[lean_exe]]
name = "hyper"
root = "HyperMain"

[[lean_exe]]
name = "extend"
root = "ExtendMain"

[[lean_exe]]
name = "cnfmap"
root = "CnfMapMain"
